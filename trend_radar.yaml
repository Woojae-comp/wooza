# 콘텐츠산업 Trend Radar 설정 (docs/TREND_RADAR.md)
# 사용자가 검토·승인하는 불용어/동의어/복합어는 lexicon.yaml에 둔다.

input:
  # 원자료 경로 (glob 가능). 명령행 --input이 우선한다.
  paths: ["data/raw/*.xlsx"]
  columns:
    article_id: 전역기사ID
    date: 기사발행일
    title: 제목
    summary: 요약
    company: 회사명
    sectors: 분야목록
    query_type: 검색구분
    press: 언론사도메인
    link: 원문링크
  # 기본 원자료 = '현재 콘텐츠 상장기업 시장평가 연구설계'의 공용 원자료. 이 버전만 받는다 (다르면 분석 전에 중단).
  # 최신 증분(네이버 API 수집)은 나중에 같은 형식으로 합친다.
  schema_column: 공용원자료스키마
  schema_versions: ["2026-07-30_v9_news_dedup"]
  # 분야목록 안의 구분자 ("게임 · 콘텐츠솔루션 | 게임, 콘텐츠솔루션")
  sector_separators: "[·,|]"

cleaning:
  # 제목+요약에 매핑된 기업명(또는 별칭)이 실제로 등장한 기사만 남긴다.
  # 검색어가 우연히 걸린 기사(예: '대교' → 삼천포대교)를 걸러낸다.
  require_company_mention: true
  # 기업명이 한 번이라도 나온 행은 남기되 '주인공' 여부를 기록한다.
  # title_or_repeat: 제목에 나오거나 요약에 min_summary_mentions번 이상 나오면 주인공.
  #   자본시장 층은 주인공 기사만 쓴다 (종목 나열·시황·"○○에 따르면" 인용·바이라인 제외).
  #   기업이 스쳐 간 기사는 콘텐츠 성향이 뚜렷할 때만 콘텐츠 층에 쓴다 (업계 동향 기사).
  # any: 한 번만 나와도 주인공으로 본다.
  mention_rule: title_or_repeat
  min_summary_mentions: 2
  # 기업명 별칭: 원자료 회사명 → 기사에 등장하는 다른 표기
  company_aliases:
    NAVER: [네이버]
    카카오: [Kakao]
    하이브: [HYBE]
    에스엠: [SM엔터테인먼트, SM엔터, SM]
    JYP Ent.: [JYP, JYP엔터테인먼트, JYP엔터]
    YG PLUS: [YG플러스]
    와이지엔터테인먼트: [YG엔터테인먼트, YG엔터, YG]
    CJ ENM: [CJENM]
    NEW: [넥스트엔터테인먼트월드]
  # 분석 대상 분야. 기업 분야가 이 중 하나라도 겹치는 행만 쓰고, 분야 매핑도 이 분야로 줄인다 (비우면 전체)
  include_sectors: [게임, 음악, 방송 및 영상, 만화, 애니메이션, 캐릭터]
  # 대상 밖 분야에만 속한 기업(영화·광고·출판·지식정보·콘텐츠솔루션 전용)의 기사는 버리지 않고 '연관산업' 한 분야로 둔다.
  # 전체 트렌드(A·C·E·F)는 핵심 분야 기사로만 계산하고, 연관산업은 분야별(B)과 융합(D)에서만 한 단계 낮게 본다.
  related_tier: true
  related_label: 연관산업
  # 분석에서 뺄 기업 (사용자 승인 후 추가)
  exclude_companies: []
  # 이 기사 수 이상에서 글자 그대로 반복되는 요약 문장 조각은 안내문으로 보고 분석 텍스트에서 뺀다 (0이면 끔)
  boilerplate_min_articles: 20
  # 제외할 제목 머리말 태그: 가격 움직임·시황·종목 나열만 전달하는 정형 기사 (2026-09-28 승인)
  # [특징주]·[게임스토커]·[클릭 e종목]·[아침밥]·[더벨]처럼 원인·사업 내용을 설명하는 태그는 남긴다.
  exclude_title_tags:
    - 서울데이터랩
    - 리스트
    - 게임스톡
    - 엔터주
    - 업앤다운
    - 주식마감기사
    - 주식마감
    - 아주증시포커스
    - N2 증시 풍향계
    - 박정식의 국내 주식시황
    - 상한가 종목
    - 급등락주 짚어보기
    - 마감시황
    - 개장시황
    - 이 시각 시황
    - 베스트&워스트
    - 이격도과열 종목
    - 상대강도과열 종목
    - 골든크로스 종목
    - 52주 최저가
    - 52주 최고가
    - 시간외 특징주
    - 급등주
    - 장마감 거래 급증주 점검
    - 오전 거래 급증주 점검
    - 오전 급등주 점검
    - 어제장 오늘장
    - 증권소식
    - 오늘의 증시일정
    - EBN 데이터센터
    - 김대호 박사의 오늘의 키워드
    - 코스피 지수선물 옵션
    - 코스닥 기관
    - 증시키워드
    - N-Stock
    - 마켓포인트

keywords:
  pos_tags: [NNG, NNP, SL]       # 일반명사, 고유명사, 외국어
  attach_suffixes: [형, 화]      # 생성+형 → 생성형, 디지털+화 → 디지털화
  min_hangul_length: 2           # 한 글자 한글 명사 제외
  min_latin_length: 2
  min_df: 10                     # 전체 기간 최소 등장 기사 수 (어휘 사전)

periods:
  # 최근 구간과 비교 구간 (분기 단위)
  recent_quarters: 2
  base_quarters: 4
  # 연간 비교: 최근 12개월 vs 그 이전 12개월, 그리고 첫 12개월
  window_months: 12

network:
  top_n: 400                     # 네트워크에 넣을 상위 키워드 수 (구간별)
  min_cooccurrence: 5
  max_edges_per_node: 15
  resolution: 1.0
  seed: 42

sectors:
  significant_min_df: 5          # 분야 내에서 '유의미하게 등장' 판정
  significant_min_share: 0.003   # 분야 기사 대비 0.3% 이상

status:
  emerging_min_recent_df: 20
  emerging_max_base_share: 0.003
  emerging_min_ratio: 2.5
  growing_min_ratio: 1.3
  growing_min_recent_df: 30
  growing_min_trend: 0.6         # 최근 6분기 비중의 순위상관
  growing_min_base_df: 20        # 기준 구간에도 있었어야 Growing (없던 것은 Emerging)
  established_min_share: 0.01
  established_max_cv: 0.4
  declining_max_ratio: 0.6
  declining_min_base_df: 30
  event_peak_multiple: 4.0       # 월 비중이 중앙값의 N배 이상
  event_min_peak_df: 15
  event_concentration: 0.5       # 전후 3개월 기사 중 최고월 비중
  spreading_min_sector_gain: 2
  converging_min_new_links: 3
  converging_min_early_df: 30    # 첫 12개월에도 있던 키워드만 (새 키워드는 Emerging)
  company_specific_share: 0.6    # 최근 기사 중 한 기업 검색 비중이 이 이상이면 '기업 한정' 표시
  structural_min_df: 50          # 두 구간 모두 이 이상 등장
  structural_max_overlap: 0.35   # 연관어 TOP20 겹침(Jaccard) 이하
  structural_min_context: 0.08   # 두 구간 모두 상위 연관어 평균 코사인 이상 (맥락이 뚜렷한 키워드만)

output:
  dir: out
  profile_top_n: 1500            # 프로파일을 만드는 키워드 수
  articles_per_list: 5

layers:
  # 기사를 콘텐츠·사업 층과 자본시장 층으로 나눠 따로 분석한다 (trend_radar/layers.py).
  # false면 모든 기사를 한 층으로 분석한다.
  enabled: true
  # 씨앗 어휘: 확실한 기사를 먼저 가르는 데만 쓴다. 나머지 키워드의 층 성향은 데이터에서 계산한다.
  content_seed: [AI, 게임, 신작, 출시, 흥행, 모바일, 콘솔, 스팀, 이용자, 업데이트, 퍼블리싱, 개발사, MMORPG, RPG, e스포츠,
                 드라마, 영화, 예능, 방송, 시청률, 시즌, OTT, 넷플릭스, 티빙, 웨이브, 디즈니, 유튜브, 숏폼, 콘텐츠, IP,
                 웹툰, 웹소설, 원작, 만화, 애니메이션, 캐릭터, 굿즈, 완구, 음악, 음원, 앨범, 음반, 아이돌, KPOP, 가수,
                 아티스트, 팬덤, 팬, 공연, 콘서트, 월드투어, 투어, 뮤지컬, 페스티벌, 관객, 개봉, 극장, 박스오피스, 제작,
                 제작사, 촬영, 배우, 감독, 작품, 스트리밍, 구독, 생성형, 메타버스, 크리에이터, 인플루언서, 도서, 출판,
                 에듀테크, 한류, 판호, 저작권, 시상식, 캠페인, 광고주, 마케팅, 플랫폼, 서비스, 글로벌, 흥행작, 기대작,
                 신규, 오리지널, 편성, 방영, 공개, 트레일러, 쇼케이스, 컴백, 데뷔, 멤버, 걸그룹, 보이그룹, 차트]
  market_seed: [주가, 목표주가, 투자의견, 매수, 매도, 코스피, 코스닥, 지수, 종목, 시가총액, 외국인, 기관, 순매수, 순매도,
                공시, 유상증자, 무상증자, 전환사채, 자기주식, 자사주, 소각, 배당, 주주, 주주환원, 주주총회, 지분, 최대주주,
                상장, 상장폐지, 공모, 영업이익, 영업손실, 매출, 순이익, 당기순이익, 적자, 흑자, 분기, 컨센서스, 증권,
                증권사, 연구원, 밸류에이션, PER, PBR, 회생, 워크아웃, 채권, 이사회, 선임, 사외이사, 감사, 횡령, 배임,
                금융감독원, 전자공시시스템, 한국거래소, 거래소, 투자자, 수급, 차익, 공매도, 신용, 레버리지, ETF, 펀드]
  seed_min_hits: 3        # 씨앗 어휘 3개 이상
  seed_dominance: 3       # 다른 층 씨앗 어휘보다 3배 이상 많아야 씨앗 기사
  seed_weight: 1.5        # 씨앗 어휘의 최소 성향
  min_df: 20
  keyword_threshold: 0.7  # |로그 오즈| 이상이면 그 층 키워드
  min_score: 3.0          # 기사 층 점수 최소
  content_min_share: 0.4  # 콘텐츠 점수 / (콘텐츠 + 시장) 이상이면 콘텐츠 층
  weak_content_min_share: 0.6  # 기업이 스쳐 간 기사는 이 이상이어야 콘텐츠 층
  weak_min_seed_hits: 2        # 그리고 콘텐츠 씨앗 어휘가 2개 이상 있어야 한다
  min_evidence: 10             # 씨앗 기사에 이 횟수 미만으로 나온 단어는 중립
  market_min_share: 0.4   # 시장 점수 비율이 이 이상이면 자본시장 층
  # 콘텐츠 층에서 추가로 뺄 키워드: 시장 씨앗 어휘 + 층 성향이 이 값 이하인 시장 키워드 (기업명 제외)
  content_drop_market_weight: -1.5
  # 콘텐츠 층에서 뺄 흔한 일반명사: 품사 NNG, 콘텐츠 성향 아님, 전체 기사 600건 이상 (확대·반영·가치·흐름 …)
  content_generic_min_df: 600
  # 콘텐츠 층 추가 제외어 (콘텐츠 흐름과 무관한데 콘텐츠 기사에 자주 섞이는 말)
  content_extra_stopwords:
    # 기업 보고서체 일반어
    [협력, 공동, 대형, 경쟁력, 기반, 성과, 체결, 판매, 환경, 신규, 차별화, 체질, 바탕, 확산, 구축, 작용, 중장기, 역량,
     프로그램, 업무, 단순, 동력, 내부, 승부수, 과제, 보상, 보수, 총괄, 전면, 변수, 재편, 대응, 마무리, 기능, 종료, 표현,
     구매, 방문, 교환, 후보, 취소, 검색어, 소식, 주목, 업계, 전략, 최고, 산업, 한국, 서울, 코리아, 세계, 확장, 기대감,
     특징주, 화제, 창업자, 전담, 독점, 부장, 직원, 기술, IT, 개편, 합류, 체제, 일시, 카드, 존속, 부과, 노사, 모험,
     # 시세 잔여어
     내림세, 오름세, 매물, 증권가, 삼성증권, 키움증권, NH, 미래에셋증권, 하나증권, KB증권, 한국투자증권, 신한투자증권,
     # ESG·지속가능경영 보고서
     ESG, 정보보호, 발간, 이해관계자, 지배구조, 거버넌스, 경영진, 탄소, 기후, KSSB, ISSB, GRI, 지속가능경영]
  # 이름이 '증권'으로 끝나는 키워드도 콘텐츠 층에서 뺀다
  content_drop_suffixes: [증권, 투자증권]

e3:
  # E3.1 (2026-09-28 사용자 결정): 이미 확인된 잡음을 E5에 넘기지 않기 위한 규칙. 변경 시 registry/decision_log.jsonl에 기록
  # 시장 구문 단어: 이 단어를 포함한 개념 구문은 최대 REVIEW (시장 씨앗어·승인 불용어에 더해)
  market_phrase_words: [특징주, 관련주, 테마주, 목표주가, 목표가, 거래일, 전거래일, 장중, 장초반, 초반, 급등, 급락, 강세, 약세,
                        상한가, 하한가, 등락, 등락률, 시가총액, 시총, 종가, 매수, 매도, 수급, 동전주, 신고가, 신저가, 주가, 증시, 코스피, 코스닥]
  # 구문 품질 규칙: 개념이 아닌 구문은 DROP
  phrase_quality:
    time_words: [이날, 오전, 오후, 올해, 내년, 작년, 지난해, 상반기, 하반기, 다음, 주, 금일, 전일, 당일, 최근, 연내, 연말, 연초, 이번]
    form_words: [홈페이지, 리포트, 보도자료, 자료, 사진, 제공, 기자, 뉴스, 브리핑, 소식]
    title_words: [부장, 차장, 과장, 대표, 회장, 사장, 이사, 의장, 위원장, 장관, 기자, 연구원, 본부장, 실장, 팀장]
  grade:
    z: 1.96
    fragment_share: 0.5
    core_persistence: 0.5
    emerging_growth: 2.0
    emerging_recent_df: 10

e5:
  # E5a 키워드 시계열 신호 (keyword_signal, trend 아님). 최종 유형은 E4 군집과 결합한 E5b에서 확정
  # 마지막 달이 말일 전에 끝나면 잠정월(is_partial_month=1): 확정 판정은 직전 완전월 기준
  input_classes: [CORE, EXTENDED, EMERGING]
  censor_months: 3             # 수집 첫 3개월 안에 등장 → left_censored (실제 최초 등장 모름, Emerging 금지)
  min_monthly_df: 5            # 월간 가중 문서빈도가 이 미만이면 증가율·Z로 유형을 주지 않음 (Insufficient)
  emerging_growth: 2.0         # 최근 3개월 평균 대비
  growing_ratio: 1.3           # 최근 6개월 비중 / 직전 6개월 비중
  declining_ratio: 0.7
  established_persistence: 0.9 # 최근 12개월 등장 비율
  spike_max_months: 2          # 최근 12개월 버스트 상태 개월 수
  spike_max_persistence: 0.5
  spike_peak_dominance: 0.5    # 최근 12개월 중 최대 달의 점유
  sector_min_df: 3
  cross_min_sectors: 3
  cross_min_entropy: 0.6
  # 방송 안내·바이라인 같은 서식어 → keyword_role=format (신호 목록 제외, 값 보존)
  format_patterns: ["방송 ?일시", "PD$", "^PD ", "기자$", "앵커$", "진행자$"]

e5b:
  # E5b 주제 트렌드 (고정 모델 월별 배정) + E4.3 계보. 신호 규칙은 e5 블록을 그대로 쓴다
  e42_run: null               # 비우면 LSA 임베딩이 있는 최신 E4.2 (가중 민감도 실행 제외)
  e5a_run: null               # 비우면 최신 E5a (가중 민감도 실행 제외)
  entity_driven_share: 0.5    # 최근 12개월 주제 가중의 절반 이상이 한 기업 기사 → entity_driven 표시
  window_months: 6            # 계보 창 길이
  step_months: 3              # 창 이동 간격
  min_topic_weight: 10        # 창 K = 창 안 가중 기사 이 이상인 고정 주제 수
  lineage_seeds: 5            # 계보 안정성: 창 군집 시드 수, 과반 시드에서 나온 사건만 안정 사건
  link_quantile: 0.05         # 이웃 창 연결 기준 = 서로 최선 짝인 쌍 코사인의 이 하위 분위 (전체 쌍 95% 분위는 0.23으로 너무 느슨했음)

e4:
  # E4 주제 군집·네트워크. 문서 K-means = 주제 기본 단위, NPMI·Leiden = 주제 구성 관계. 자동 선택은 Borda 순위 평균(제안)
  concept_classes: [CORE, EXTENDED]            # 개념 네트워크 (개념어만)
  extended_classes: [CORE, EXTENDED, EMERGING] # 개체 확장 네트워크 (개념어 + 작품·기업·인물·정책명)
  general_max_z_pct: 0.5     # 허브 일반어 = 개념어 중 B 특이도 하위 50% 이면서
  general_min_df_pct: 0.9    #              문서빈도 상위 10% → 네트워크에서 제외 (문서 군집에는 IDF로만 약화)
  network_grid:
    min_co: [5, 10]
    npmi: [0.10, 0.20]
    topk: [15, 20]
    resolution: [0.6, 1.0, 1.4]
  leiden_seeds: 5
  k_grid: [80, 120, 160, 220]
  kmeans_seeds: 5
  min_keywords: 2            # 보존 핵심어 2개 미만 기사는 군집 입력 제외 → 가장 가까운 중심에 저신뢰로 배정
  silhouette_sample: 8000
  subtopic_ratio: 0.5        # 최대 대응 공동체 질량의 절반 이상인 공동체 → 하위 주제 후보
  # 잡음 탐침 (평가 전용, E5a Event Spike에서 드러난 비콘텐츠 사건). 군집 입력·등급에는 쓰지 않음
  noise_probes: [청문회, 후보자, 모임 통장, 부산 상어, 카카오 뱅크 앱]

e41:
  # E4.1 문서 군집 보완 (2026-09-28 사용자 결정). A Leiden 기사 배정 = 운영 기준선, B LSA K-means = 도전자, C 분야별 층화 = 보완 실험
  title_weight: 2.0          # 제목 용어 가중 (본문 없음 → 제목 + 요약)
  network:
    topk: 15
    resolution: 1.4          # E4 자동 제안값
    base_min_co: 10          # 기본 백본
    base_npmi: 0.20
    rare_min_co: 5           # 희소 분야 보완 백본 (연결량은 적지만 결합 강도 높은 관계만 추가)
    rare_npmi: 0.30
  min_coverage: 0.3          # 기사 핵심어 TF-IDF 질량 중 공동체 소속 비율이 이 미만이면 LOW
  margin_min: 0.1            # 1·2위 점수 차 (1위 대비) 이 미만이고 분할 기사가 아니면 LOW
  split_min_mass: 0.25       # 1·2위 공동체가 각각 기사 공동체 질량의 25% 이상 → 두 공동체에 점수 비례 분할
  svd_dims: [100, 200, 300]
  lsa_k_grid: [80, 120, 160]
  sector_weight_power: 0.5   # 분야 기사 수의 제곱근 역수
  small_sectors: [만화, 애니메이션, 캐릭터]
  stratified_k_total: 120
  stratified_dim: 100
  stratified_link_cosine: 0.5
  stratified_weak_mass: 0.3
  refine_size_quantile: 0.9  # 가중 기사량 상위 10% 공동체
  refine_coherence_quantile: 0.25   # 또는 일관성 하위 25% → LSA 세분화 (k는 실루엣으로 2~8 중 선택)
  refine_min_articles: 100
  eval_exclude_n: 3000       # 잡음 평가용 사후 배정 (학습 입력에 섞지 않음)
  eval_review_low_n: 2000
  gates:
    ari_gain: 0.2            # 기준선(E4 희소 K-means) 시드 ARI + 0.2 이상
    largest_share_max: 0.10
    low_conf_max: 0.30
  noise_risk_max: 0.2
  entity_concentration: 0.7  # 이상이면 ENTITY_EVENT (실패로 보지 않고 유형 분리)
  cross_min_share: 0.2
  cross_max_share: 0.6
  policy_min_hits: 2
  # 정책 유형 판정 단어 (주제 유형 표시 전용, 군집 입력에 쓰지 않음)
  policy_words: [규제, 정책, 법, 법안, 개정, 정부, 문체부, 문화체육관광부, 공정위, 공정거래위원회, 과징금, 제재, 국회, 청문회, 진흥, 지원, 등급, 셧다운, 확률형, 저작권, 관세, 한한령, 과세, 세제, 후보자, 장관]

e42:
  # E4.2 주제 구조 확정 (2026-09-28 사용자 결정). 기본 단위 LSA100 + K-means K=120, Leiden은 해석, 층화는 복구
  base_dim: 100
  base_k: 120
  # 교차 분야 연결어: 낮은 특이도지만 정책·산업 해석에 필요. Leiden 제외, 사전·주제명·확산 지표 사용 (decision_log)
  generic_bridge: [AI, 플랫폼, 방송]
  reject_quantile: 0.05       # 군집 내부 중심 유사도 하위 5% = 배정 거부 경계 (민감도: 10%)
  reject_quantile_alt: 0.10
  margin_quantile: 0.10       # 1·2위 유사도 차가 학습 기사 하위 10% 미만이면 LOW
  entity_list_min: 6          # 한 기사에 기업·고유명사 용어 6개 이상 → 종목·기업 나열 기사
  market_article_dominant: 0.5
  entity_list_dominant: 0.5
  external_vs_concept: 0.5    # 외부 기업·종목명 비중이 콘텐츠 개념어 비중의 절반 이상
  probe_absorption_max: 0.1
  low_coherence_quantile: 0.10
  noise_score_max: 0.0        # 잡음 성분 합이 콘텐츠 성분 합보다 크면 잡음
  sub_silhouette_tolerance: 0.01
  sub_seed_ari: 0.60
  sub_min_docs: 30
  sub_min_share: 0.03
  sub_coherence_gain: 0.05
  rescue_max_cosine: 0.35     # K=120 주제 중심과의 최대 코사인이 이 미만
  rescue_min_docs: 30         # 최소 규모, 일관성은 K=120 주제 중앙값 이상
  network:
    topk: 15
    resolution: 1.4
    base_min_co: 10
    base_npmi: 0.20
    rare_min_co: 5
    rare_npmi: 0.30

e2:
  # 운영 포인터: 하류 단계(E3·E4·E5)는 '최신'이 아니라 여기 지정된 실행만 읽는다 (trend_radar/selection.py)
  # 후보는 --use-candidate 로 명시했을 때만 하류에 연결. 통과 후에만 selected_* 교체 (decision_log)
  selected_model_id: e2_1_operational
  selected_run_id: run_20260928_221314_4bc3
  candidate_model_id: null
  candidate_run_id: null
  selection_status: approved
  # E2.1 잡음 유입 보정 (2026-09-28 사용자 결정). 강제 제외가 아니라 EXCLUDE 방향 투표 → 라벨 모델이 정확도 추정
  noise_lfs: true
  # 방송사 출처 전용 규칙: 검색 기업 → 기사 속 표기 (출처 자리에만 나오면 EXCLUDE 방향)
  broadcasters:
    YTN: [YTN]
    SBS: [SBS, SBS Biz, SBSBiz]
    한국경제TV: [한국경제TV, 한경TV, 와우넷]
    KNN: [KNN]
    티비씨: [TBC, 티비씨]
    iMBC: [iMBC, MBC]
    스카이라이프: [스카이라이프, skyTV, 스카이TV]
    LG헬로비전: [LG헬로비전, 헬로비전]
  # 방송사·프로그램·방송산업이 기사 주제일 때의 단어 (콘텐츠 씨앗어와 함께 → 하나라도 있으면 기권)
  broadcast_topic_words: [드라마, 예능, 편성, 시청률, 방영, 방송법, 재허가, 재승인, 민영화, 매각, 인수, 지분, 최대주주,
                          실적, 매출, 영업이익, 광고, 채널, 사장, 노조, 파업, 중계, 중계권, 개편, 저작권, 수신료, 종편, 지상파]
  # 정치·사회 섹션 규칙: 이 단어가 있으면 기권 (콘텐츠·방송·저작권·플랫폼 정책)
  excluded_sections: ["100", "102"]
  policy_anchor_words: [문체부, 문화체육관광부, 저작권, 방송법, 방통위, 방송통신위원회, 방송통신, 재허가, 재승인, 민영화, 수신료,
                        OTT, 플랫폼법, 플랫폼 규제, 온라인플랫폼, 온라인 플랫폼, 게임법, 게임산업, 확률형, 게임물관리위원회, 등급분류,
                        웹툰, 웹소설, 음악산업, 음원, 창작자, 학습데이터, 학습 데이터, AI 학습, 콘텐츠 진흥, 콘텐츠진흥원, 영화진흥,
                        영진위, 한한령, 망 사용료, 망사용료, 넷플릭스, 유튜브, 콘텐츠 산업, 콘텐츠산업, 방송사, 소유구조]
  # E2.2: 검색 기업명이 콘텐츠 근거가 되는 조건 — 제목·요약에 산업 행위어가 함께 있을 때만 (없으면 콘텐츠 점수에서 제외)
  industry_action_words: [제작, 편성, 방영, 유통, 배급, 공연, 콘서트, 투어, 컴백, 발매, 출시, 개봉, 흥행, 실적, 매출, 영업이익, 적자, 흑자,
                          규제, 인수, 매각, 합병, 투자, 계약, 라이선스, 판권, 퍼블리싱, 서비스, 업데이트, 신작, 드라마, 예능, 웹툰, 음원, 앨범, 게임]
  # 탐침 (평가 전용): 정치·사회 잡음 유입 측정
  politics_probe_words: [청문회, 후보자, 김건희, 통일교, 특검, 국정감사, 내란, 탄핵, 대선, 총선, 여야, 野, 與]
  # E2.3c 사건 이슈 계열: 콘텐츠 분야 기업명과 같은 문장에 나오면 CONTENT 투표 (가이드 v1.1 EVENT_ISSUE)
  event_issue_words: [수사, 기소, 재판, 압수수색, 제재, 불성실공시, 고발, 무죄, 유죄, 선고, 혐의, 소송, 가처분,
                      과징금, 구속, 영장, 송치, 벌점, 시정명령, 징계, 피소, 횡령, 배임]
  # 하한(REVIEW 올림)에서 뺄 기사 목록형 제목
  list_title_pattern: "주요\\s*공시|기업\\s*공시|공시\\s*\\]|브리핑|모닝|주요기사|外|이모저모"

e22_gates:
  # E2.2 선정 기준 (E2.1 대비). 모두 통과한 모델 중 탐침 감소가 크고 방향 불일치가 작은 모델
  probe_drop_pp: 5.0          # 정치·사회 탐침 INCLUDE·REVIEW 비율이 5%p 이상 감소 (실질 감소)
  anchor_drop_pp: 2.0         # 콘텐츠 앵커 유입률 하락 2%p 이내
  broadcast_excess_pp: 3.0    # 방송 분야 감소율이 다른 분야 평균보다 3%p 넘게 크지 않음
  policy_exclude_max: 0.01    # 정책 기사 EXCLUDE 이동률 1% 미만
  relevant_rate_shift: 0.10   # 전체 관련 판정이 10% 넘게 변하면 원인 확인 표시

e23_gates:
  # E2.3 필수 기준 (E2.1 운영 대비). E4.2 비잡음 주제 탐침 흡수(0.67 → 목표 0.55 이하)는 체인 재실행 뒤 확인
  probe_drop_pp: 5.0
  anchor_drop_pp: 2.0
  policy_exclude_max: 0.01
  broadcast_excess_pp: 2.0
  include_change_max: 0.30    # INCLUDE 수가 30% 이상 바뀌면 자동 확정하지 않음

relevance_weighting:
  # E4·E5 기사 가중치. half = E2 판정 가중 (운영). half_x_pcontent = 판정 가중 × E2.3c P(CONTENT) (민감도 실험, 유입 여부는 그대로)
  mode: half
  variants_run: run_20260929_080416_5969
  column: p_content_H2_event
  floor: 0.0

e23c_gates:
  # E2.3c 사건 이슈 보강 — 가이드 v1.1 개발용 비교 기준 (LLM 합의 = 참고 판정)
  noncontent_reduction_min: 0.3   # 합의 MARKET+OTHER 의 INCLUDE+REVIEW 유입을 E2.1 대비 30% 이상 줄인다

e23b_gates:
  # E2.3b 라벨 모델 단계 기준 (분류기를 붙이기 전)
  probe_drop_pp: 5.0
  anchor_drop_pp: 2.0
  policy_exclude_max: 0.01
  broadcast_excess_pp: 2.0
  anchor_content_min: 0.5        # 콘텐츠 앵커 중 CONTENT 예측 비율 (CONTENT 클래스 붕괴 확인, E2.3은 0.32)
  family_removal_pp: 10.0        # 한 계열 제거 시 CONTENT 비율 변화
  prior_agreement_min: 0.95      # Prior-L/M 판정 일치율

review:
  # E2 결과 비교·검토 (파일 업로드 방식, 검토 절차 명세 v1.0). LLM API 호출 없음, 운영 포인터 변경 없음
  representative_n: 400        # E2.1 판정 × 섹션 코드 유무 6층, 모집단 비례
  diagnostic_n: 200             # 혼합(콘텐츠+주가)·코드 없는 정치 탐침어·콘텐츠 정책·방송사 출처·모델 간 판정 변경, 범주별 40
  representative_dev_n: 100
  diagnostic_dev_n: 100
  initial_n: 60                 # 개발용에서 먼저 검토 (30건 × 2묶음)
  batch_size: 30
